function t(key, ...args){
  const val = translations[lang][key];
  if(typeof val === 'function') return val(...args);
  return val !== undefined ? val : key;
}
function localeStr(){ return lang === 'ru' ? 'ru-RU' : 'en-US'; }

/* ============ Reactions (likes/dislikes) storage ============ */
function getReactions(){
  try{ return JSON.parse(localStorage.getItem('nb_reactions') || '{}'); }catch(e){ return {}; }
}
function setReactions(obj){
  try{ localStorage.setItem('nb_reactions', JSON.stringify(obj)); }catch(e){}
}

/* ============ Helpers ============ */
function esc(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}
function fmtDate(ts){
  if(!ts || !ts.toDate) return '';
  const d = ts.toDate();
  return d.toLocaleDateString(localeStr(), {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtDateTime(ts){
  if(!ts || !ts.toDate) return '';
  const d = ts.toDate();
  return d.toLocaleDateString(localeStr(), {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' +
         d.toLocaleTimeString(localeStr(), {hour:'2-digit', minute:'2-digit'});
}
function colorFor(str){
  let h = 0;
  for(let i=0;i<(str||'').length;i++) h = (h*31 + str.charCodeAt(i)) % PLACEHOLDER_COLORS.length;
  return PLACEHOLDER_COLORS[Math.abs(h)];
}
function thumbHtml(s){
  if(s.image){
    return `<img class="thumb" src="${esc(s.image)}" alt="${esc(s.name||'')}">`;
  }
  const letter = (s.name || '?').trim().charAt(0).toUpperCase() || '?';
  return `<div class="thumb ph" style="background:${colorFor(s.name || s.game || 'x')};">${esc(letter)}</div>`;
}

/* ============ Modal system ============ */
function openModal(innerHtml){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'nb-overlay';
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal(){
  const ex = document.getElementById('nb-overlay');
  if(ex) ex.remove();
}

/* ============ Router ============ */
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);

function router(){
  const hash = location.hash || '#/';
  if(hash.startsWith('#/script/')){
    const id = decodeURIComponent(hash.split('/')[2] || '');
    renderDetailPage(id, 'script');
  } else if(hash.startsWith('#/injector/')){
    const id = decodeURIComponent(hash.split('/')[2] || '');
    renderDetailPage(id, 'injector');
  } else if(hash.startsWith('#/injectors')){
    renderHome('injector');
  } else {
    renderHome('script');
  }
}

  app.innerHTML = `

      <div class="search-wrap">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

    </div>
  `;
  bindNavHandlers(kind);
  document.getElementById('search-input').addEventListener('input', (e) => {
    renderGrid(filterItems(e.target.value), kind);
  });
  loadItems(kind);
}

function filterItems(query){
  const q = (query || '').trim().toLowerCase();
  if(!q) return allItems;
  return allItems.filter(s =>
    (s.name || '').toLowerCase().includes(q) || (s.game || '').toLowerCase().includes(q)
  );
}

function renderGrid(list, kind){
  const isInj = kind === 'injector';
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('script-count');
  const heroCount = document.getElementById('hero-count');
  if(!grid) return;
  if(heroCount) heroCount.textContent = isInj ? t('injectorsInBase', allItems.length) : t('scriptsInBase', allItems.length);
  if(countEl) countEl.textContent = t('resultsCount', list.length);
  if(list.length === 0){
    const emptyMsg = allItems.length === 0 ? (isInj ? t('emptyInjectors') : t('emptyScripts')) : t('nothingFound');
    grid.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }
  grid.innerHTML = list.map((s, i) => `
    <a class="card" href="#/${kind}/${encodeURIComponent(s.id)}" style="animation-delay:${Math.min(i,10) * 45}ms;">
      ${thumbHtml(s)}
      <div class="card-body">
        <div class="card-name">${esc(s.name || '—')}</div>
        <div class="card-meta">
          ${!isInj ? `<span class="card-game">${esc(s.game || '—')}</span>` : `<span class="card-game">${s.version ? 'v' + esc(s.version) : '—'}</span>`}
          <span class="badge ${s.hasKey ? 'key' : 'nokey'}">${s.hasKey ? t('key') : t('noKey')}</span>
        </div>
        <div class="card-meta">
          ${isInj ? `<span class="badge platform">${s.platform === 'mobile' ? t('platformMobile') : t('platformPc')}</span>` : '<span></span>'}
          <span class="card-date">${fmtDate(s.createdAt)}</span>
        </div>
      </div>
    </a>
  `).join('');
}

function loadItems(kind){
  const isInj = kind === 'injector';
  db.collection(collectionFor(kind)).get().then(snap => {
    const grid = document.getElementById('grid');
    if(!grid) return;
    if(snap.empty){
      allItems = [];
      grid.innerHTML = `<div class="empty">${isInj ? t('emptyInjectors') : t('emptyScripts')}</div>`;
      const heroCount = document.getElementById('hero-count');
      if(heroCount) heroCount.textContent = isInj ? t('injectorsInBase', 0) : t('scriptsInBase', 0);
      return;
    }
    let docs = [];
    snap.forEach(doc => docs.push({id: doc.id, ...doc.data()}));
    docs.sort((a,b) => {
      const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return tb - ta;
    });
    allItems = docs;
    const searchInput = document.getElementById('search-input');
    renderGrid(filterItems(searchInput ? searchInput.value : ''), kind);
  }).catch(err => {
    console.error(err);
    const grid = document.getElementById('grid');
    if(grid) grid.innerHTML = `<div class="error">${isInj ? t('errorInjectors') : t('errorScripts')}</div>`;
  });
}

    }
  });
  previewImg.addEventListener('error', () => { preview.style.display = 'none'; });

  const dlFileInput = document.getElementById('f-dl-file');
  const dlFileName = document.getElementById('f-dl-filename');
  if(dlFileInput){
    dlFileInput.addEventListener('change', () => {
      const f = dlFileInput.files && dlFileInput.files[0];
      if(f){
        dlFileName.textContent = t('fileSelected', f.name);
        dlFileName.style.display = 'block';
      } else {
        dlFileName.style.display = 'none';
      }
    });
  }

  document.getElementById('add-submit').onclick = () => {
    const name = document.getElementById('f-name').value.trim();
    const gameEl = document.getElementById('f-game');
    const game = gameEl ? gameEl.value.trim() : '';
    const codeEl = document.getElementById('f-code');
    const code = codeEl ? codeEl.value.trim() : '';
    const dlLinkEl = document.getElementById('f-dl-link');
    const dlLink = dlLinkEl ? dlLinkEl.value.trim() : '';
    const dlFile = dlFileInput && dlFileInput.files ? dlFileInput.files[0] : null;
    const hasKey = document.getElementById('f-haskey').checked;
    const link1 = document.getElementById('f-link1').value.trim();
    const link2 = document.getElementById('f-link2').value.trim();
    const skipLinks = document.getElementById('f-skip').checked;
    const imageUrl = imageUrlInput.value.trim();
    const gateText = document.getElementById('f-gatetext').value.trim();
    const description = document.getElementById('f-description').value.trim();
    const platformEl = document.getElementById('f-platform');
    const platform = platformEl ? platformEl.value : null;
    const versionEl = document.getElementById('f-version');
    const version = versionEl ? versionEl.value.trim() : '';
    const errEl = document.getElementById('add-error');

    if(isInj){
      if(!name || (!dlLink && !dlFile)){
        errEl.textContent = t('fillRequiredInjector');
        errEl.style.display = 'block';
        return;
      }
    } else {
      if(!name || !game || !code){
        errEl.textContent = t('fillRequired');
        errEl.style.display = 'block';
        return;
      }
    }
    errEl.style.display = 'none';
    const links = [link1, link2].filter(Boolean);
    const submitBtn = document.getElementById('add-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = t('publishing');

    const finish = (finalCode) => {
      const payload = {
        name, code: finalCode, hasKey, links, skipLinks,
        image: imageUrl || null,
        gateHint: gateText || null,
        description: description || null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if(isInj){
        payload.game = null;
        payload.platform = platform || 'pc';
        payload.version = version || null;
      } else {
        payload.game = game;
      }
      submitToDb(payload);
    };

    const submitToDb = (payload) => {
      db.collection(collectionFor(kind)).add(payload).then(() => {
        closeModal();
        loadItems(kind);
      }).catch(err => {
        console.error(err);
        errEl.textContent = t('saveError');
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = t('publish');
      });
    };

    if(isInj && dlFile){
      submitBtn.textContent = t('uploading');
      const path = `injectors/${Date.now()}_${dlFile.name}`;
      const ref = storage.ref().child(path);
      ref.put(dlFile).then(snap => snap.ref.getDownloadURL()).then(url => {
        finish(url);
      }).catch(err => {
        console.error(err);
        errEl.textContent = t('uploadError');
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = t('publish');
      });
      return;
    }

    finish(isInj ? dlLink : code);
  };
}

/* ============ Detail page (script or injector) ============ */
function renderDetailPage(id, kind){
  currentKind = kind;
  const isInj = kind === 'injector';
  app.innerHTML = `
    ${navHeader(kind)}
    <div class="wrap wrap-detail">
      <a href="#/${isInj ? 'injectors' : ''}" class="backlink">${isInj ? t('backLinkInjectors') : t('backLink')}</a>
      <div class="detail-layout">
        <div id="script-page-body" class="detail-main"><div class="loading">${t('loadingScripts')}</div></div>
        <aside class="detail-aside" id="detail-aside"></aside>
      </div>
    </div>
  `;
  bindNavHandlers(kind);

  if(!id){
    document.getElementById('script-page-body').innerHTML = `<div class="error">${isInj ? t('injectorNotFoundEmpty') : t('scriptNotFoundEmpty')}</div>`;
    return;
  }

  db.collection(collectionFor(kind)).doc(id).get().then(doc => {
    const body = document.getElementById('script-page-body');
    if(!body) return;
    if(!doc.exists){
      body.innerHTML = `<div class="error">${isInj ? t('injectorNotExist') : t('scriptNotExist')}</div>`;
      return;
    }
    const s = doc.data();
    document.title = `${s.name || (isInj ? 'Injector' : 'Script')} — NbScripts`;
    body.innerHTML = `
      <div class="script-card">
        ${s.image ? `<div class="banner-wrap"><img class="script-banner" src="${esc(s.image)}" alt="${esc(s.name||'')}"></div>` : ''}
        <div class="script-body">
          <h2>${esc(s.name || '—')}</h2>
          <div class="meta-line">
            ${!isInj ? `<span class="game">${t('game')}: ${esc(s.game || '—')}</span>` : (s.version ? `<span class="game">${t('version')}: ${esc(s.version)}</span>` : '')}
            <span class="badge ${s.hasKey ? 'key' : 'nokey'}">${s.hasKey ? t('key') : t('noKey')}</span>
            ${isInj ? `<span class="badge platform">${s.platform === 'mobile' ? t('platformMobile') : t('platformPc')}</span>` : ''}
          </div>
          ${s.description ? `<p class="script-desc">${esc(s.description)}</p>` : ''}
          <button class="btn btn-accent get-btn" id="get-script-btn">${isInj ? t('getInjector') : t('getScript')}</button>
          <button class="btn btn-report" id="report-script-btn">${t('reportScript')}</button>
        </div>
      </div>
      <div class="comments">
        <h3>${t('comments')}</h3>
        <div class="comment-form">
          <input type="text" id="c-author" placeholder="${t('commentPlaceholderName')}">
          <textarea id="c-text" placeholder="${t('commentPlaceholderText')}"></textarea>
          <div class="inline-error" id="c-error" style="display:none;"></div>
          <div class="row-actions">
            <button class="btn btn-accent" id="c-submit">${t('send')}</button>
          </div>
        </div>
        <div id="comments-list"><div class="loading">${t('loadingComments')}</div></div>
      </div>
    `;

    document.getElementById('get-script-btn').onclick = () => handleGetScript(s);
    document.getElementById('report-script-btn').onclick = () => openReportModal(id, s);
    document.getElementById('c-submit').onclick = () => submitComment(id);
    loadComments(id);
    loadRecommendations(kind, id, s.game);
  }).catch(err => {
    console.error(err);
    const body = document.getElementById('script-page-body');
    if(body) body.innerHTML = `<div class="error">${isInj ? t('errorLoadInjector') : t('errorLoadScript')}</div>`;
  });
}

/* ============ Recommendations sidebar ============ */
function asideThumbHtml(s){
  if(s.image){
    return `<img class="aside-thumb" src="${esc(s.image)}" alt="">`;
  }
  const letter = (s.name || '?').trim().charAt(0).toUpperCase() || '?';
  return `<div class="aside-thumb ph" style="background:${colorFor(s.name || s.game || 'x')};">${esc(letter)}</div>`;
}

function loadRecommendations(kind, currentId, currentGame){
  db.collection(collectionFor(kind)).get().then(snap => {
    const aside = document.getElementById('detail-aside');
    if(!aside) return;
    let docs = [];
    snap.forEach(doc => { if(doc.id !== currentId) docs.push({id: doc.id, ...doc.data()}); });
    if(docs.length === 0){ aside.innerHTML = ''; return; }
    docs.sort((a, b) => {
      const aMatch = (a.game || '') && (a.game || '') === (currentGame || '') ? 1 : 0;
      const bMatch = (b.game || '') && (b.game || '') === (currentGame || '') ? 1 : 0;
      if(aMatch !== bMatch) return bMatch - aMatch;
      const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return tb - ta;
    });
    const list = docs.slice(0, 5);
    aside.innerHTML = `
      <div class="aside-title">${t('recommended')}</div>
      <div class="aside-list">
        ${list.map((s, i) => `
          <a class="aside-card" href="#/${kind}/${encodeURIComponent(s.id)}" style="animation-delay:${i * 45}ms;">
            ${asideThumbHtml(s)}
            <div class="aside-card-body">
              <div class="aside-card-name">${esc(s.name || '—')}</div>
              ${kind !== 'injector' ? `<div class="aside-card-game">${esc(s.game || '—')}</div>` : (s.version ? `<div class="aside-card-game">v${esc(s.version)}</div>` : '')}
            </div>
          </a>
        `).join('')}
      </div>
    `;
  }).catch(err => {
    console.error(err);
    const aside = document.getElementById('detail-aside');
    if(aside) aside.innerHTML = '';
  });
}

function openReportModal(scriptId, s){
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>${t('reportTitle')}</h3>
    <p class="gate-hint">${t('reportHint')}</p>
    <div class="field">
      <textarea id="report-text" placeholder="${t('reportPlaceholder')}"></textarea>
    </div>
    <div class="inline-error" id="report-error" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-accent" id="report-submit">${t('reportSend')}</button>
    </div>
  `);
  const textEl = document.getElementById('report-text');
  textEl.focus();
  document.getElementById('report-submit').onclick = () => {
    const reason = textEl.value.trim();
    const errEl = document.getElementById('report-error');
    if(!reason){
      errEl.textContent = t('reportEmptyError');
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    const btn = document.getElementById('report-submit');
    btn.disabled = true;
    db.collection('reports').add({
      scriptId, scriptName: s.name || '', kind: currentKind,
      reason,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      openModal(`
        <button class="close-x" onclick="closeModal()">✕</button>
        <h3>${t('reportThanksTitle')}</h3>
        <p class="gate-hint">${t('reportThanksText')}</p>
      `);
    }).catch(err => {
      console.error(err);
      errEl.textContent = t('reportSendError');
      errEl.style.display = 'block';
      btn.disabled = false;
    });
  };
}

function handleGetScript(s){
  const links = Array.isArray(s.links) ? s.links.filter(Boolean) : [];
  if(s.skipLinks || links.length === 0){
    openRevealModal(s.code);
    return;
  }
  const visited = new Set();
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>${t('gateTitle')}</h3>
    <p class="gate-hint">${esc(s.gateHint) || t('gateHint')}</p>
    <div class="gate-links" id="gate-links">
      ${links.map((l, idx) => `
        <a class="gate-link" data-idx="${idx}" href="${esc(l)}" target="_blank" rel="noopener noreferrer">
          <span>${t('channel', idx + 1)}</span><span class="n" data-n="${idx}">${t('open')}</span>
        </a>
      `).join('')}
    </div>
    <button class="btn btn-accent get-btn" id="confirm-sub-btn" disabled>${t('getScriptCount', 0, links.length)}</button>
  `);

  const confirmBtn = document.getElementById('confirm-sub-btn');
  document.querySelectorAll('#gate-links .gate-link').forEach(el => {
    el.addEventListener('click', () => {
      const idx = el.getAttribute('data-idx');
      if(!visited.has(idx)){
        visited.add(idx);
        el.classList.add('visited');
        const n = el.querySelector('.n');
        if(n) n.textContent = t('opened');
      }
      confirmBtn.textContent = t('getScriptCount', visited.size, links.length);
      confirmBtn.disabled = visited.size < links.length;
    });
  });
  confirmBtn.onclick = () => {
    if(confirmBtn.disabled) return;
    openRevealModal(s.code);
  };
}

function openRevealModal(code){
  const isInj = currentKind === 'injector';
  if(isInj){
    openModal(`
      <button class="close-x" onclick="closeModal()">✕</button>
      <h3>${t('yourInjector')}</h3>
      <a class="btn btn-accent get-btn" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;" href="${esc(code || '')}" target="_blank" rel="noopener noreferrer">${t('downloadBtn')}</a>
      <button class="btn btn-ghost" id="copy-btn" style="width:100%;margin-top:10px;">${t('copyLink')}</button>
    `);
  } else {
    openModal(`
      <button class="close-x" onclick="closeModal()">✕</button>
      <h3>${t('yourScript')}</h3>
      <div class="code-box">
        <pre id="reveal-code"></pre>
        <button class="btn btn-accent" id="copy-btn" style="width:100%;">${t('copy')}</button>
      </div>
    `);
    document.getElementById('reveal-code').textContent = code || '';
  }
  document.getElementById('copy-btn').onclick = (e) => {
    navigator.clipboard.writeText(code || '').then(() => {
      e.target.textContent = t('copied');
      setTimeout(() => { if(e.target) e.target.textContent = isInj ? t('copyLink') : t('copy'); }, 1600);
    });
  };
}

/* ============ Comments ============ */
function loadComments(scriptId){
  db.collection('comments').where('scriptId', '==', scriptId).get().then(snap => {
    const list = document.getElementById('comments-list');
    if(!list) return;
    if(snap.empty){
      list.innerHTML = `<div class="empty" style="padding:20px;">${t('emptyComments')}</div>`;
      return;
    }
    let docs = [];
    snap.forEach(doc => docs.push({id: doc.id, ...doc.data()}));
    docs.sort((a,b) => {
      const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return tb - ta;
    });
    const reactions = getReactions();
    list.innerHTML = docs.map((c, i) => {
      const reacted = reactions[c.id];
      const likes = c.likes || 0;
      const dislikes = c.dislikes || 0;
      return `
        <div class="comment" style="animation-delay:${Math.min(i,8) * 40}ms;">
          <div class="c-head">
            <span class="c-author">${esc(c.author || t('anon'))}</span>
            <span class="c-date">${fmtDateTime(c.createdAt)}</span>
          </div>
          <div class="c-text">${esc(c.text || '')}</div>
          <div class="c-reactions">
            <button class="react-btn ${reacted === 'like' ? 'active-like' : ''}" data-id="${c.id}" data-type="like">👍 ${likes}</button>
            <button class="react-btn ${reacted === 'dislike' ? 'active-dislike' : ''}" data-id="${c.id}" data-type="dislike">👎 ${dislikes}</button>
          </div>
        </div>
      `;
    }).join('');
    list.querySelectorAll('.react-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        reactToComment(btn.getAttribute('data-id'), btn.getAttribute('data-type'), scriptId);
      });
    });
  }).catch(err => {
    console.error(err);
    const list = document.getElementById('comments-list');
    if(list) list.innerHTML = `<div class="error">${t('errorComments')}</div>`;
  });
}

function reactToComment(commentId, type, scriptId){
  const reactions = getReactions();
  const current = reactions[commentId];
  const field = type === 'like' ? 'likes' : 'dislikes';
  const otherField = type === 'like' ? 'dislikes' : 'likes';

  let update;
  let newReaction;
  if(current === type){
    // toggle off — remove the reaction
    update = { [field]: firebase.firestore.FieldValue.increment(-1) };
    newReaction = null;
  } else if(current){
    // switch reaction — remove old, add new
    update = {
      [otherField]: firebase.firestore.FieldValue.increment(-1),
      [field]: firebase.firestore.FieldValue.increment(1)
    };
    newReaction = type;
  } else {
    // new reaction
    update = { [field]: firebase.firestore.FieldValue.increment(1) };
    newReaction = type;
  }

  db.collection('comments').doc(commentId).update(update).then(() => {
    if(newReaction){ reactions[commentId] = newReaction; }
    else { delete reactions[commentId]; }
    setReactions(reactions);
    loadComments(scriptId);
  }).catch(err => console.error(err));
}

function submitComment(scriptId){
  const authorEl = document.getElementById('c-author');
  const textEl = document.getElementById('c-text');
  const errEl = document.getElementById('c-error');
  const text = textEl.value.trim();
  const author = authorEl.value.trim() || t('anon');

  if(!text){
    errEl.textContent = t('commentEmptyError');
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  const btn = document.getElementById('c-submit');
  btn.disabled = true;

  db.collection('comments').add({
    scriptId, author, text, likes: 0, dislikes: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    textEl.value = '';
    authorEl.value = '';
    btn.disabled = false;
    loadComments(scriptId);
  }).catch(err => {
    console.error(err);
    errEl.textContent = t('commentSendError');
    errEl.style.display = 'block';
    btn.disabled = false;
  });
}
